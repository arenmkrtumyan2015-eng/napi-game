<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Напи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap&subset=cyrillic" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#ecf8f2;--card:#fff;--ink:#24313f;--hint:#6b7d8c;
  --mint:#7fd8b5;--mint-d:#2a9873;--mint-l:#dff4ea;--lav:#b9a7f0;--lav-d:#7a63d6;--peach:#ffc9a8;--pink:#ff8fab;--pink-d:#e0577b;
  --line:#d3eadf;--tile:#f1faf5;
  --gw:max(250px,min(92vw,360px,calc(100dvh - 330px)));
  --r-s:12px;--r-m:18px;--r-l:26px;
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:600;overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--lav-d);outline-offset:2px}
b{font-weight:800}
#app{width:100%;max-width:520px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative}

/* шапка */
.hud{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 4px}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px 6px 10px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line)}
.pill i{font-style:normal;font-size:18px;line-height:1}
.pill.pop{animation:pillpop .35s}
@keyframes pillpop{40%{transform:scale(1.12)}}
.hud #snd+#help{margin-left:0}
.hud .round{margin-left:auto;width:40px;height:40px;padding:0;justify-content:center;border:0;font-size:17px;font-weight:800;color:var(--hint)}

main{flex:1;overflow-y:auto;padding:6px 14px 18px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}

/* навигация */
nav{display:flex;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fff;border-radius:var(--r-l) var(--r-l) 0 0;box-shadow:0 -4px 18px rgba(42,152,115,.12)}
nav button{flex:1;border:0;background:none;padding:2px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--hint);border-radius:var(--r-m);min-height:52px}
nav .ic{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px;transition:background .2s,transform .2s}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--mint-d);font-weight:800}
nav button.on .ic{background:var(--mint-l)}
nav button:active .ic{transform:scale(.92)}

/* сцена с питомцем */
.stage{position:relative;text-align:center;border-radius:var(--r-l);padding:10px 0 14px;overflow:hidden;min-height:300px;box-shadow:0 3px 0 var(--line),inset 0 0 0 2px rgba(255,255,255,.55)}
.bubble{display:inline-block;position:relative;background:#fff;color:var(--ink);border-radius:var(--r-m);padding:8px 16px;font-size:14px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.08);margin-bottom:12px;max-width:62%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:0 0 4px 0}
.petbox{position:relative;display:flex;justify-content:center;cursor:pointer;animation:idle 3s ease-in-out infinite}
.petbox.bounce svg{animation:bounce .5s}
@keyframes idle{50%{transform:translateY(-4px)}}
@keyframes bounce{30%{transform:scale(1.12,.9)}60%{transform:scale(.94,1.08)}}
.floaty{position:absolute;top:30%;font-size:26px;animation:fl 1s forwards;pointer-events:none}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.deco{position:absolute;font-size:26px;opacity:.85;pointer-events:none}
.side{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:8px;z-index:2}
.side button{position:relative;border:0;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:16px;width:56px;padding:6px 0 5px;font-size:21px;line-height:1.1;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.side small{display:block;font-size:10.5px;color:var(--ink);font-weight:800;margin-top:1px}
.side button:active{transform:scale(.94)}
.side .dot{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--pink-d);border:2.5px solid #fff;animation:dot 1.6s ease-in-out infinite}
@keyframes dot{50%{transform:scale(1.25)}}

/* карточки, строки */
.card{background:#fff;border-radius:var(--r-m);padding:14px;margin:10px 0;box-shadow:0 2px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lvl{background:var(--lav-d);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.bar{height:12px;background:#e3f2ea;border-radius:8px;overflow:hidden}
.bar.thin{height:8px;margin-top:8px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .4s}
.bar .f{background:linear-gradient(90deg,#ffb3c6,var(--pink))}
.bar .m{background:linear-gradient(90deg,#ffe0c8,#ffb27f)}
.bar .e{background:linear-gradient(90deg,#a8ebd0,var(--mint))}
.bar .x{background:linear-gradient(90deg,#d8ccf8,var(--lav))}
.stat{display:grid;grid-template-columns:38px 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:5px;align-items:center;margin-top:12px;font-size:14px}
.stat .si{grid-row:1 / 3;width:38px;height:38px;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:20px}
.stat .sl{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.stat em{font-style:normal;color:var(--hint);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.low .si{background:#ffe3e9;animation:dot 1.2s ease-in-out infinite}
.stat.low em{color:var(--pink-d);font-weight:800}

.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts button{position:relative;border:0;border-radius:var(--r-m);background:#fff;padding:12px 2px 10px;font-size:26px;line-height:1.1;box-shadow:0 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.acts button span{display:block;font-size:12px;color:var(--ink);margin-top:3px;font-weight:700}
.acts button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.acts button.need{background:#fff4f6;box-shadow:0 3px 0 #ffd0da,inset 0 0 0 2px var(--pink)}

.item .em{flex:none;width:52px;height:52px;border-radius:16px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:30px}
.item .grow{flex:1;min-width:0}
.item small{display:block;color:var(--hint);font-size:12px;font-weight:600;margin-top:2px}

.btn{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:800;background:var(--mint-d);color:#fff;box-shadow:0 3px 0 #1d7556;transition:transform .1s,box-shadow .1s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #1d7556}
.btn.small{padding:9px 14px;font-size:14px;min-height:40px;border-radius:12px}
.btn.ghost{background:var(--mint-l);color:var(--mint-d);box-shadow:0 3px 0 #bfe5d4}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 #bfe5d4}
.btn.poor{background:#e8eeeb;color:#8a9a93;box-shadow:0 3px 0 #d5ddd9}
.btn:disabled{opacity:.5;box-shadow:none}

.seg{display:flex;gap:4px;margin:6px 0 10px;padding:4px;background:#d9eee3;border-radius:var(--r-m)}
.seg button{flex:1;border:0;border-radius:14px;padding:10px 4px;background:none;font-weight:800;font-size:14px;color:var(--hint);transition:background .15s,color .15s}
.seg button.on{background:#fff;color:var(--mint-d);box-shadow:0 2px 0 rgba(0,0,0,.07)}
.hint{color:var(--hint);font-size:13px;font-weight:600;text-align:center;margin:8px 0;line-height:1.4}
h3{margin:6px 0 10px;font-size:22px;font-weight:900;letter-spacing:-.01em}
h2{font-weight:900}

/* шторка */
#sheet{position:fixed;inset:0;background:rgba(30,40,50,.4);display:none;align-items:flex-end;z-index:30}
#sheet.on{display:flex;animation:fade .2s}
#sbody{position:relative;background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:26px 14px calc(24px + env(safe-area-inset-bottom));max-height:80vh;max-height:80dvh;overflow:auto}
#sheet.on #sbody{animation:up .3s cubic-bezier(.2,.9,.3,1)}
#sbody::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:#bcd8ca}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translateX(-50%)}

/* игры */
#game{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20}
#game.on{display:flex;animation:fade .2s}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;font-weight:900;font-size:20px}
.ghead button{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;box-shadow:0 2px 0 var(--line)}
#gbody{flex:1;display:flex;justify-content:center;overflow-x:hidden;overflow-y:auto}
.gin{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:8px 10px calc(16px + env(safe-area-inset-bottom));touch-action:none}
.gin.result{touch-action:pan-y}
.ghud{font-size:16px;font-weight:700;text-align:center;background:#fff;border-radius:999px;padding:7px 18px;box-shadow:0 2px 0 var(--line);font-variant-numeric:tabular-nums}
.ghud b{font-size:20px;font-weight:900}
.bigpet{cursor:pointer}
.bigpet.pop svg{animation:bounce .25s}
#grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;width:var(--gw);aspect-ratio:1;background:#cfe9dc;padding:8px;border-radius:var(--r-m)}
.c{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:900;font-size:clamp(18px,6vw,28px)}
#pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:var(--gw)}
.pc{aspect-ratio:1;border:0;border-radius:14px;background:var(--lav);font-size:30px;position:relative;box-shadow:0 3px 0 #9a86dc}
.pc span{opacity:0;transition:opacity .2s}
.pc::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:900}
.pc.open,.pc.done{background:#fff;box-shadow:inset 0 0 0 3px var(--mint)}
.pc.open span,.pc.done span{opacity:1}
.pc.open::after,.pc.done::after{display:none}
canvas{width:var(--gw);border-radius:var(--r-m);background:#fff;touch-action:none;box-shadow:0 3px 0 var(--line)}
#pads{display:flex;gap:8px;width:var(--gw)}
.pad{flex:1;border:0;border-radius:14px;padding:16px 0;font-size:24px;background:#fff;box-shadow:0 3px 0 var(--line)}
.pad:active{transform:translateY(2px)}
.result{justify-content:center;text-align:center}
.result .big{font-size:72px;animation:bounce .6s}
.result h2{margin:0}
.result .score{font-size:34px;font-weight:900;margin:0}
.result p{margin:2px 0}
.rowbtn{display:flex;gap:10px;margin-top:12px}
.rowbtn .btn{flex:1}
.rec{display:flex;justify-content:space-between;align-items:center}
.hole{aspect-ratio:1;border:0;border-radius:var(--r-m);background:#cfe9dc;font-size:38px;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.sp{padding:34px 0;font-size:48px;border-radius:var(--r-m);transition:transform .15s,filter .15s}

/* питомец: анимации */
.ps .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.ps .earL,.ps .earR{transform-box:fill-box;transform-origin:50% 95%;animation:ear 6s ease-in-out infinite}
.ps .earR{animation-delay:.5s}
@keyframes ear{0%,86%,100%{transform:rotate(0)}91%{transform:rotate(-9deg)}96%{transform:rotate(7deg)}}
.ps .chew{transform-box:fill-box;transform-origin:center;animation:chew .3s infinite}
@keyframes chew{50%{transform:scaleY(.35)}}
.petbox.e-joy svg,.petbox.e-wow svg{animation:hop .55s ease-in-out 4}
.petbox.e-laugh svg{animation:shake .22s linear 12}
.petbox.e-love svg,.petbox.e-cuddle svg,.petbox.e-cool svg,.petbox.e-wink svg{animation:sway 1.1s ease-in-out 3}
.petbox.e-eat svg,.petbox.e-shy svg{animation:bounce .5s 3}
.petbox.e-angry svg{animation:shake .15s linear 16}
.petbox.e-cry svg{animation:shake .35s linear 8}
@keyframes hop{40%{transform:translateY(-28px) scale(.96,1.05)}80%{transform:scale(1.06,.93)}}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg) translateY(-4px)}}
.ps .tear{animation:tear .9s ease-in infinite}
@keyframes tear{0%{opacity:0;transform:translateY(-4px)}30%{opacity:1}100%{opacity:0;transform:translateY(16px)}}


/* ровные игры */
.gin>.ghud,.gin>.hint,.gin>.btn,.gin>.rowbtn{width:var(--gw)}
.gin>.hint{margin:0}
.gin>.btn.small{min-height:44px}
#gtitle{display:flex;align-items:center;gap:10px}
#gtitle svg{display:block}
.mq{width:var(--gw);text-align:center;font-size:44px;font-weight:900;background:#fff;border-radius:var(--r-m);padding:22px 0;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.pad.mb{font-size:30px;font-weight:900;padding:24px 0}

/* лицо Напи вместо эмодзи */
.ps.face .eyes,.ps.face .earL,.ps.face .earR{animation:none}
.ps.face{display:block}
.item .em.face,.gtile .em.face{background:#fff3f7}

/* сетка игр */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gtile{border:0;text-align:left;background:#fff;border-radius:var(--r-m);padding:12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:156px;transition:transform .1s,box-shadow .1s}
.gtile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.gtile .em{width:52px;height:52px;border-radius:16px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:5px}
.gtile b{font-size:16px;font-weight:900;line-height:1.15}
.gtile small{color:var(--hint);font-size:12px;font-weight:600;line-height:1.3}
.gtile .bst{margin-top:auto;padding-top:6px;font-size:12px;font-weight:800;color:var(--mint-d)}
.gtile .bst.none{color:var(--hint);font-weight:700}

/* прокрутка */
main,#sbody{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fu,0px),#000 calc(100% - var(--fd,0px)),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fu,0px),#000 calc(100% - var(--fd,0px)),transparent 100%);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sbar{position:absolute;right:3px;width:5px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5;background:rgba(42,152,115,.12)}
.sbar.has{opacity:.6}
.sbar.on{opacity:1}
.sbar i{display:block;width:100%;background:var(--mint-d);border-radius:3px}


/* иконки игр: Напи + эмблема */
.gi{position:relative;display:inline-flex;flex:none}
.gi svg{display:block}
.gi i{position:absolute;right:calc(var(--s)*-.3);bottom:calc(var(--s)*-.16);width:calc(var(--s)*.56);height:calc(var(--s)*.56);border-radius:50%;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.18),0 0 0 2px #fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:calc(var(--s)*.34);line-height:1}
.gtile .em{width:68px;height:68px;overflow:visible}
.gl{display:flex;align-items:center;gap:14px}
#gtitle{gap:16px}

/* ползунок управления */
.slide{position:relative;width:var(--gw);height:60px;border-radius:999px;background:#d9eee3;box-shadow:inset 0 2px 0 rgba(0,0,0,.06);touch-action:none;flex:none}
.slide::before{content:"";position:absolute;left:30px;right:30px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:repeating-linear-gradient(90deg,#aed6c2 0 6px,transparent 6px 14px)}
.slide .th{position:absolute;left:0;top:5px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;will-change:transform}

/* реакция и эмоции */
.rbox{width:var(--gw);height:calc(var(--gw)*.9);border:0;border-radius:var(--r-l);background:#d8d0f6;box-shadow:0 4px 0 #b9a7f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:900;color:var(--ink);transition:background .12s}
.rbox.go{background:#9be3c4;box-shadow:0 4px 0 #5fbf98}
.rbox.ok{background:#fff;box-shadow:0 4px 0 var(--line)}
.rbox.bad{background:#ffd0da;box-shadow:0 4px 0 #f2a3b5}
.rbox:active{transform:translateY(2px)}
.mq.face{padding:14px 0;display:flex;justify-content:center}
.pad.sm{font-size:18px;padding:20px 4px}
.pad.fc{padding:8px 0;display:flex;justify-content:center;align-items:center}
.mq .eask{min-height:130px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;text-align:center;padding:0 12px}
.mq .esay{position:relative;margin:30px 12px 34px;padding:18px 20px;background:#e3f5ec;border-radius:22px;box-shadow:none;font-size:22px;font-weight:800;text-align:center;max-width:var(--gw)}
.mq .esay::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-12px;border:12px solid transparent;border-bottom:0;border-top-color:#e3f5ec}

/* задания к играм и достижения */
.gqc{padding:12px 14px}
.gqc .gqt{color:var(--hint);font-size:12px;font-weight:700}
.gqi{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #e6f3ec}
.gqc .row+.gqi{border-top:0;margin-top:4px}
.gqi b{display:block;font-size:14px;line-height:1.25}
.gqi small{color:var(--hint);font-size:12px;font-weight:700}
.gqi .bar{margin:5px 0 2px}
.gqi.done{opacity:.55}
.gqi.chest b{color:var(--mint-d)}
.gqe{flex:none;width:40px;height:40px;border-radius:12px;background:#fff3f7;display:flex;align-items:center;justify-content:center;font-size:24px}
.gqe .gi{transform:scale(.8)}
.gqok{font-size:20px;font-weight:900;color:var(--mint-d);padding:0 8px}
.gqr{font-size:12px;font-weight:800;color:var(--hint);white-space:nowrap}
.gqi .btn.small,.achi .btn.small{white-space:nowrap;flex:none}
.achi{display:flex;align-items:center;gap:10px}
.achi .grow,.gqi .grow{flex:1;min-width:0}
.achi .em{flex:none;width:44px;height:44px;border-radius:14px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:24px}
.achi small{display:block;color:var(--hint);font-size:12px;font-weight:700}
.achi .bar{margin:6px 0 3px}
.achi.ready{box-shadow:0 2px 0 var(--line),inset 0 0 0 2px var(--lav-d)}
.achi.got{opacity:.6}
.achh{margin:14px 2px 2px;font-size:12px;font-weight:900;color:var(--hint);text-transform:uppercase;letter-spacing:.04em}
.rnote{margin:6px auto;max-width:300px;background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;box-shadow:0 2px 0 var(--line)}
.rnote.ach{background:#f1ecff}

/* песенка */
.bubble{cursor:pointer}
.bubble .sy{transition:color .1s,transform .1s;display:inline-block}
.bubble .sy.on{color:var(--pink-d);transform:translateY(-2px) scale(1.15)}
.bubble .sy.was{color:var(--mint-d)}
.petbox.singing svg{animation:sway .6s ease-in-out infinite}

/* сон в кровати */
.stage{transition:background .6s}
.stage.night .bubble{background:#2b3570;color:#e8ecff}
.stage.night .bubble::after{background:#2b3570}
.petbox.inbed{animation:none}
.bed{width:250px;max-width:66vw;height:auto;overflow:visible}
.bed .breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3.2s ease-in-out infinite}
.bed .blanket{transform-box:fill-box;transform-origin:50% 0;animation:blanket 3.2s ease-in-out infinite}
@keyframes breath{50%{transform:translateY(2px) scale(1.015,.985)}}
@keyframes blanket{50%{transform:scaleY(1.03)}}
.zz{position:absolute;font-weight:900;color:#c9d2ff;pointer-events:none;animation:zz 3.6s ease-out infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-60px) scale(1.3)}}
.win{position:absolute;right:12%;top:14%;width:62px;height:70px;border-radius:30px 30px 6px 6px;background:radial-gradient(circle at 64% 34%,#fff6c9 0 11px,transparent 12px),linear-gradient(#0f1638,#26306a);box-shadow:inset 0 0 0 4px #8f7ac9;pointer-events:none}
.win::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:4px;margin-left:-2px;background:#8f7ac9}
.win::after{content:"";position:absolute;left:4px;right:4px;top:42%;height:4px;background:#8f7ac9}
.twk{position:absolute;color:#fff6c9;font-size:12px;pointer-events:none;animation:twk 2.4s ease-in-out infinite}
@keyframes twk{50%{opacity:.25;transform:scale(.7)}}

/* кормление */
.fly{position:absolute;left:0;top:0;font-size:38px;line-height:1;pointer-events:none;z-index:3;will-change:transform}
.crumb{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:3}
.yum{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:20px;font-weight:900;color:var(--mint-d);background:#fff;border-radius:999px;padding:4px 12px;box-shadow:0 2px 0 rgba(0,0,0,.08);pointer-events:none;z-index:3;animation:yum 1.4s ease-out forwards;white-space:nowrap}
@keyframes yum{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}

@media (prefers-reduced-motion:reduce){
  .bed .breath,.bed .blanket,.zz,.twk{animation:none}
  .zz{opacity:1}
  .petbox,.side .dot,.stat.low .si,.ps .eyes,.ps .earL,.ps .earR{animation:none}
  #sheet.on,#sheet.on #sbody,#game.on{animation:none}
}

let LBUF = null, lLoading = false, lastLove = 0, talking = false;
function loadLove() {
  if (LBUF || lLoading || !AC) return; lLoading = true;
  const bin = atob(LOVE_MP3), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const ok = b => { LBUF = b; lLoading = false; }, bad = () => { lLoading = false; };
  try { const r = AC.decodeAudioData(u.buffer, ok, bad); if (r && r.then) r.then(ok, bad); } catch (e) { bad(); }
}
function sayLove() {
  if (!AC || !S.snd || singing || talking) return;
  if (!LBUF) { loadLove(); return; }
  const now = Date.now(); if (now - lastLove < 9000) return; lastLove = now;
  if (AC.state !== 'running') { const r = AC.resume(); if (r && r.catch) r.catch(() => {}); }
  const B = voiceBus(), src = AC.createBufferSource(); src.buffer = LBUF; src.connect(B.in); src.connect(B.rev); src.start(AC.currentTime + .05);

}

  src.connect(B.in); src.connect(B.rev); src.start(t0);

function gMath(el, done) {
  el.innerHTML = `<div class="ghud"><b id="gt">30</b> с · верно: <b id="gs">0</b></div><div class="mq" id="mq"></div><div id="pgrid" style="grid-template-columns:repeat(2,1fr)"></div><p class="hint">Ошибка отнимает 2 секунды</p>`;
  let s = 0, t = 30, over = false, lock = false, ans = 0; const tm = [];
  const end = () => { if (over) return; over = true; clearInterval(iv); tm.push(setTimeout(() => done(s), 300)); };
  const iv = setInterval(() => { t--; $('#gt', el).textContent = Math.max(0, t); if (t <= 0) end(); }, 1000);
  const pick = btn => {
    if (over || lock) return;
    if (+btn.dataset.v === ans) { s++; $('#gs', el).textContent = s; haptic('light'); q(); return; }
    lock = true; haptic('error'); t = Math.max(0, t - 2); $('#gt', el).textContent = t; btn.style.background = '#ffd0da'; btn.style.opacity = '.55';
    if (t <= 0) { end(); return; }

  };
  const q = () => {
    let a, b, op; const lv = s < 5 ? 0 : s < 12 ? 1 : 2;
    if (lv === 2 && Math.random() < .5) { a = 2 + Math.random() * 8 | 0; b = 2 + Math.random() * 8 | 0; op = '×'; ans = a * b; }
    else { const m = lv === 0 ? 9 : 25; a = 1 + Math.random() * m | 0; b = 1 + Math.random() * m | 0; if (Math.random() < .5) { op = '+'; ans = a + b; } else { if (a < b) [a, b] = [b, a]; op = '−'; ans = a - b; } }
    const opts = new Set([ans]); while (opts.size < 4) { const d = (1 + Math.random() * 5 | 0) * (Math.random() < .5 ? -1 : 1); if (ans + d >= 0) opts.add(ans + d); }
    $('#mq', el).textContent = a + ' ' + op + ' ' + b + ' = ?';
    $('#pgrid', el).innerHTML = [...opts].sort(() => Math.random() - .5).map(v => `<button class="pad mb" data-v="${v}">${v}</button>`).join('');
    el.querySelectorAll('.mb').forEach(btn => btn.onpointerdown = e => { e.preventDefault(); pick(btn); });
    lock = false;
  };
  q();
  return () => { over = true; clearInterval(iv); tm.forEach(clearTimeout); };
}

    if (q.k === 'play' && q.g === g.id) Q.p[i]++;
    if (q.k === 'diff') Q.p[i] = Q.gs.length;
    if (q.k === 'rec' && rec) Q.p[i] = 1;
    if (q.k === 'total') Q.p[i]++;
    if (q.k === 'coins') Q.p[i] += coins;
    if (!was && Q.p[i] >= q.n) out.push(gqText(q));
  });
  return out;
}
const gqClaimable = () => { const Q = gq(); return Q.L.some((q, i) => Q.p[i] >= q.n && !Q.ok[i]) || (Q.ok.every(Boolean) && !Q.b); };
function gqHTML() {
  const Q = gq(), all = Q.ok.every(Boolean);
  return `<div class="card gqc"><div class="row"><b>🎯 Задания к играм</b><small class="gqt">новые завтра</small></div>` + Q.L.map((q, i) => {
    const v = Math.min(Q.p[i], q.n), full = v >= q.n, g = q.g && GAMES.find(x => x.id === q.g);
    const btn = Q.ok[i] ? '<span class="gqok">✓</span>' : full ? `<button class="btn small" data-gq="${i}">${rw(q.r)}</button>` : g ? `<button class="btn small ghost" data-gqp="${g.id}">Играть</button>` : `<span class="gqr">${rw(q.r)}</span>`;
    return `<div class="gqi${Q.ok[i] ? ' done' : ''}"><span class="gqe">${g ? gIcon(g, 34) : { diff: '🎲', rec: '🏆', total: '🎮', coins: '🪙' }[q.k]}</span><div class="grow"><b>${gqText(q)}</b><div class="bar thin"><i style="width:${v / q.n * 100}%;background:var(--mint)"></i></div><small>${v}/${q.n}</small></div>${btn}</div>`;
  }).join('') + `<div class="gqi chest${Q.b ? ' done' : ''}"><span class="gqe">${Q.b ? '📭' : '🧰'}</span><div class="grow"><b>Сундук за все 3 задания</b><small>${rw(GQ_BONUS)}</small></div>${Q.b ? '<span class="gqok">✓</span>' : `<button class="btn small" data-gqb ${all ? '' : 'disabled'}>Открыть</button>`}</div></div>`;
}
function gqBind(re) {
  const Q = gq();
  document.querySelectorAll('[data-gq]').forEach(b => b.onclick = () => { const i = +b.dataset.gq, q = Q.L[i]; if (Q.ok[i] || Q.p[i] < q.n) return; Q.ok[i] = 1; S.gqn++; give(q.r); save(); updateHud(); haptic('success'); toast('Награда: ' + rw(q.r)); re(); });
  document.querySelectorAll('[data-gqp]').forEach(b => b.onclick = () => { haptic('light'); closeSheet(); openGame(b.dataset.gqp); });
  const cb = document.querySelector('[data-gqb]'); if (cb) cb.onclick = () => { if (Q.b || !Q.ok.every(Boolean)) return; Q.b = 1; S.gqf++; give(GQ_BONUS); save(); updateHud(); haptic('success'); toast('🧰 Сундук открыт: ' + rw(GQ_BONUS)); re(); };
}
const dstr = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const today = () => dstr(new Date());
function qs() { const t = today(); if (!S.q || S.q.d !== t) S.q = { d: t, pat: 0, game: 0, feed: 0, done: {} }; return S.q; }
function dgState() { if (S.dgLast === today()) return -1; return S.dgLast === dstr(new Date(Date.now() - 864e5)) ? (S.dgDay || 0) % 7 : 0; }
const maybeDaily = () => { if (dgState() >= 0) openDaily(); };
function closeTut() { closeSheet(); setTimeout(maybeDaily, 300); }

function emote(k, fx) {
  if (S.sleeping) { toast('Тсс… Напи спит'); return; }
  clearTimeout(emoT); emo = k; lastKey = ''; refreshPet();
  if (fx) for (let i = 0; i < 3; i++) setTimeout(() => floaty(fx), i * 250);
  haptic('success'); emoT = setTimeout(() => { emo = null; lastKey = ''; refreshPet(); }, 2800);
}
function applyBG() {
  const st = $('.stage'); if (!st) return; const b = BGS.find(x => x.id === S.bg) || BGS[0];
  st.querySelectorAll('.deco,.win,.twk').forEach(d => d.remove()); st.classList.toggle('night', !!S.sleeping);
  if (S.sleeping) {
    st.style.background = 'linear-gradient(#1c2350 0,#2c3672 70%,#3b3166 70%,#33295a)';
    st.insertAdjacentHTML('beforeend', '<i class="win"></i>' + [[91, 6], [95, 32], [86, 46], [68, 50], [80, 60]].map(([l, t], i) => `<span class="twk" style="left:${l}%;top:${t}%;animation-delay:${i * .45}s">✦</span>`).join(''));
    return;
  }
  st.style.background = b.css;
  b.d.forEach((e, i) => { const x = document.createElement('span'); x.className = 'deco'; x.textContent = e; x.style.cssText = ['right:9%;top:24%', 'right:20%;bottom:10%', 'left:30%;bottom:8%'][i]; st.appendChild(x); });
}
function openBG() {
  $('#sheet').classList.add('on');
  $('#sbody').innerHTML = `<h3>🖼️ Фоны · ❤️ ${S.hearts}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${BGS.map(b => `<div class="card" style="margin:0;padding:8px;text-align:center"><div style="height:64px;border-radius:12px;background:${b.css}"></div><div style="margin:6px 0 4px;font-size:14px;font-weight:700">${b.e} ${b.n}</div><button class="btn small ${S.bg === b.id ? '' : S.bgs[b.id] ? 'ghost' : ''}" data-bg="${b.id}">${S.bg === b.id ? '✓ Надет' : S.bgs[b.id] ? 'Надеть' : b.p + ' ❤️'}</button></div>`).join('')}</div>`;
  document.querySelectorAll('[data-bg]').forEach(x => x.onclick = () => {
    const b = BGS.find(z => z.id === x.dataset.bg);
    if (!S.bgs[b.id]) { if (S.hearts < b.p) { haptic('error'); toast('Не хватает ❤️'); return; } S.hearts -= b.p; S.bgs[b.id] = 1; }
    S.bg = b.id; save(); updateHud(); applyBG(); haptic('success'); openBG();
  });
}
function openDaily() {
  const day = dgState(); if (day < 0) { toast('Подарок на сегодня уже забран 🎁'); return; }
  $('#sheet').classList.add('on');
  $('#sbody').innerHTML = `<h3 style="text-align:center">Ежедневный подарок! 🎁</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px">${DG.map((v, i) => `<div style="border-radius:12px;padding:8px 0;background:${i === day ? 'var(--pink)' : '#fff'};color:${i === day ? '#fff' : 'var(--ink)'};opacity:${i < day ? .5 : 1}"><b>${i < day ? '✓' : (i + 1) + 'д'}</b><br>+${v}❤️</div>`).join('')}</div><p class="hint">А ещё каждый день в холодильник: +1 🎂 Торт</p><div class="rowbtn"><button class="btn" id="dgc">Забрать ${DG[day]} ❤️</button></div>`;
  $('#dgc').onclick = () => { S.hearts += DG[day]; S.bag.cake = (S.bag.cake || 0) + 1; S.dgLast = today(); S.dgDay = day + 1; save(); updateHud(); closeSheet(); haptic('success'); toast('+' + DG[day] + ' ❤️ и 🎂 в холодильник'); };
}
function openQuests() {
  const q = qs(); $('#sheet').classList.add('on');
  $('#sbody').innerHTML = '<h3>📋 Задания дня</h3>' + QS.map(x => { const v = Math.min(q[x.id], x.n), d = q.done[x.id]; return `<div class="card"><div class="row"><b>${x.t}</b><button class="btn small" data-q="${x.id}" ${v < x.n || d ? 'disabled' : ''}>${d ? '✓' : '+' + x.r + ' 🪙'}</button></div><div class="bar thin"><i style="width:${v / x.n * 100}%;background:var(--mint)"></i></div><small style="color:var(--hint)">${v}/${x.n}</small></div>`; }).join('') + '<h3 style="margin-top:18px">🎮 К играм</h3>' + gqHTML() + '<p class="hint">Задания обновляются каждый день</p>'; gqBind(openQuests);
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const x = QS.find(z => z.id === b.dataset.q); q.done[x.id] = 1; S.coins += x.r; save(); updateHud(); haptic('success'); openQuests(); });
}
function openAch() {
  $('#sheet').classList.add('on');
  const row = (a, i) => { const v = Math.min(achV(a), a.t), ok = v >= a.t, got = S.achc[i];
    return `<div class="card achi${got ? ' got' : ok ? ' ready' : ''}"><span class="em">${ok ? a.e : '🔒'}</span><div class="grow"><b>${a.n}</b><small>${a.d}</small>${ok ? '' : `<div class="bar thin"><i style="width:${v / a.t * 100}%;background:var(--lav-d)"></i></div><small>${v}/${a.t} · ${rw(a.r)}</small>`}</div>${got ? '<span class="gqok">✓</span>' : ok ? `<button class="btn small" data-ac="${i}">${rw(a.r)}</button>` : ''}</div>`; };
  const idx = ACH.map((a, i) => i), done = idx.filter(i => achOk(ACH[i])).length;
  const ready = idx.filter(i => achOk(ACH[i]) && !S.achc[i]), prog = idx.filter(i => !achOk(ACH[i])).sort((x, y) => achV(ACH[y]) / ACH[y].t - achV(ACH[x]) / ACH[x].t), got = idx.filter(i => S.achc[i] && achOk(ACH[i]));
  $('#sbody').innerHTML = `<h3>🏅 Достижения · ${done}/${ACH.length}</h3><div class="bar" style="margin-bottom:12px"><i style="width:${done / ACH.length * 100}%;background:var(--lav-d)"></i></div>` +
    (ready.length ? '<p class="achh">Забери награду</p>' + ready.map(i => row(ACH[i], i)).join('') : '') +
    (prog.length ? '<p class="achh">В процессе</p>' + prog.map(i => row(ACH[i], i)).join('') : '') +
    (got.length ? '<p class="achh">Получено</p>' + got.map(i => row(ACH[i], i)).join('') : '');
  document.querySelectorAll('[data-ac]').forEach(b => b.onclick = () => { const i = +b.dataset.ac, a = ACH[i]; if (S.achc[i] || !achOk(a)) return; S.achc[i] = 1; give(a.r); save(); updateHud(); haptic('success'); toast(a.e + ' ' + a.n + ': ' + rw(a.r)); openAch(); refreshPet(); });
}

/* ---------- друзья ---------- */
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const dec = x => { try { return JSON.parse(decodeURIComponent(escape(atob(x.replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return null; } };
const tgUser = () => (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const myName = () => { const u = tgUser(); return String((u && (u.first_name || u.username)) || S.name || 'Игрок').slice(0, 16); };
const myMask = () => ACH.reduce((m, a, i) => m | (achOk(a) ? 1 << i : 0), 0);
const myCard = () => ({ u: S.uid, n: myName(), l: S.lvl, a: myMask(), g: S.gp || 0, p: S.pats, t: Math.floor(Date.now() / 864e5) });
const ago = t => { if (!t) return 'ещё без карточки'; const d = Math.floor(Date.now() / 864e5) - t; return d <= 0 ? 'обновлено сегодня' : 'обновлено ' + d + ' дн. назад'; };
function shareTG(url, text) {
  const link = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(link);
  else if (navigator.share) navigator.share({ text, url }).catch(() => {});
  else { try { navigator.clipboard.writeText(url); toast('Ссылка скопирована 📋'); } catch (e) { window.open(link, '_blank'); } }
}
function shareCard() { shareTG(BOT_LINK + '?startapp=p_' + enc(myCard()), 'Моя карточка в Напи 🐰 Уровень ' + S.lvl + '. Добавь меня в друзья!'); }
function renderFriends() {
  const fr = Object.entries(S.friends);
  $('#main').innerHTML = `<h3>👥 Друзья</h3><div class="card"><b>Как это работает</b><p class="hint" style="text-align:left;margin:6px 0">1. Отправь другу свою карточку. 2. Он откроет её и добавит тебя. 3. Пусть пришлёт свою в ответ. Теперь вы видите достижения друг друга и можете дарить подарки. Чтобы обновить достижения, просто отправь карточку снова.</p><div class="rowbtn"><button class="btn small" id="fcard">📤 Моя карточка</button><button class="btn small ghost" id="finv">➕ Позвать</button></div></div>` +
    (fr.length ? fr.map(([u, f]) => `<div class="card row item"><span class="em face">${petSVG('happy', 44, true)}</span><div class="grow"><b>${esc(f.n)}</b> <span class="lvl">Ур. ${f.l || 1}</span><small style="display:block;color:var(--hint);font-size:12px;margin-top:3px">🏅 ${ACH.filter((a, i) => (f.a >> i) & 1).length}/${ACH.length} · 🎮 ${f.g || 0} · ${ago(f.t)}</small></div><button class="btn small" data-fo="${esc(u)}">Открыть</button></div>`).join('') : '<p class="hint">Пока никого. Отправь карточку другу!</p>');
  $('#fcard').onclick = shareCard; $('#finv').onclick = invite;
  document.querySelectorAll('[data-fo]').forEach(b => b.onclick = () => openFriend(b.dataset.fo));
}
function openFriend(u) {
  const f = S.friends[u]; if (!f) return; $('#sheet').classList.add('on');
  $('#sbody').innerHTML = `<h3>${esc(f.n)} <span class="lvl">Ур. ${f.l || 1}</span></h3><p class="hint" style="text-align:left">🎮 игр: ${f.g || 0} · 🤚 поглаживаний: ${f.p || 0}<br>${ago(f.t)}</p>` +
    ACH.map((a, i) => { const ok = (f.a >> i) & 1; return `<div class="card row item" style="opacity:${ok ? 1 : .5};margin:6px 0"><span class="em">${a.e}</span><div class="grow"><b>${a.n}</b><small>${a.d}</small></div><span>${ok ? '✅' : '🔒'}</span></div>`; }).join('') +
    `<div class="rowbtn"><button class="btn" id="fg">🎁 Подарить</button><button class="btn ghost" id="fd">Удалить</button></div>`;
  $('#fg').onclick = () => openGift(u);
  $('#fd').onclick = () => { delete S.friends[u]; save(); closeSheet(); renderFriends(); };
}
function openGift(u) {
  const f = S.friends[u]; if (!f) return;
  const opts = ALL.filter(i => (S.bag[i.id] || 0) > 0).map(i => ({ k: i.id, e: i.e, n: i.n, ok: true, s: '×' + S.bag[i.id] }))
    .concat([{ k: 'h5', e: '❤️', n: '5 сердечек', ok: S.hearts >= 5, s: 'у тебя ' + S.hearts }, { k: 'c50', e: '🪙', n: '50 монет', ok: S.coins >= 50, s: 'у тебя ' + S.coins }]);
  $('#sbody').innerHTML = `<h3>🎁 Подарок для ${esc(f.n)}</h3><p class="hint">Подарок спишется у тебя. Потом выбери этого друга в Telegram.</p>` +
    opts.map(o => `<div class="card row item" style="margin:6px 0"><span class="em">${o.e}</span><div class="grow"><b>${o.n}</b><small>${o.s}</small></div><button class="btn small" data-gk="${o.k}" ${o.ok ? '' : 'disabled'}>Дарить</button></div>`).join('');
  document.querySelectorAll('[data-gk]').forEach(b => b.onclick = () => sendGift(u, b.dataset.gk));
}
function sendGift(u, k) {
  const f = S.friends[u]; if (!f) return;
  if (k === 'h5') { if (S.hearts < 5) return; S.hearts -= 5; } else if (k === 'c50') { if (S.coins < 50) return; S.coins -= 50; } else { if (!(S.bag[k] > 0)) return; S.bag[k]--; }
  S.sent = (S.sent || 0) + 1; save(); updateHud(); closeSheet(); haptic('success');
  shareTG(BOT_LINK + '?startapp=g_' + enc({ u: S.uid, n: myName(), t: u, k, i: Math.random().toString(36).slice(2, 8) }), '🎁 ' + f.n + ', у меня для тебя подарок в Напи!');
}
function recvCard(c) {
  if (!c || !c.u || !c.n) return; if (c.u === S.uid) { toast('Это твоя собственная карточка 🙂'); return; }
  const isNew = !S.friends[c.u];
  S.friends[c.u] = { n: String(c.n).slice(0, 16), l: +c.l || 1, a: +c.a || 0, g: +c.g || 0, p: +c.p || 0, t: +c.t || 0 }; save();
  $('#sheet').classList.add('on');
  $('#sbody').innerHTML = `<div style="text-align:center"><div style="font-size:56px">🤝</div><h3>${isNew ? 'Новый друг: ' : 'Карточка обновлена: '}${esc(S.friends[c.u].n)}</h3><p>Теперь ты видишь его достижения во вкладке «Друзья».</p></div><div class="rowbtn"><button class="btn" id="rc1">📤 Отправить мою в ответ</button><button class="btn ghost" id="rc2">Закрыть</button></div>`;
  $('#rc1').onclick = () => { closeSheet(); shareCard(); }; $('#rc2').onclick = closeSheet;
  if (tab === 'friends') renderFriends();
}
function recvGift(g) {
  if (!g || !g.u || !g.i) return;
  if (g.t !== S.uid) { toast('Этот подарок для другого игрока 🎁'); return; }
  if (S.claimed.includes(g.i)) { toast('Подарок уже получен 🎁'); return; }
  let txt;
  if (g.k === 'h5') { S.hearts += 5; txt = '+5 ❤️'; } else if (g.k === 'c50') { S.coins += 50; txt = '+50 🪙'; }
  else { const it = ALL.find(x => x.id === g.k); if (!it) return; S.bag[it.id] = (S.bag[it.id] || 0) + 1; txt = it.e + ' ' + it.n; }
  S.claimed.push(g.i); S.claimed = S.claimed.slice(-100);
  if (!S.friends[g.u]) S.friends[g.u] = { n: String(g.n || 'Друг').slice(0, 16), l: 1, a: 0, g: 0, p: 0, t: 0 };
  save(); updateHud(); haptic('success'); $('#sheet').classList.add('on');
  $('#sbody').innerHTML = `<div style="text-align:center"><div style="font-size:56px">🎁</div><h3>Подарок от ${esc(String(g.n || 'друга').slice(0, 16))}!</h3><p class="score" style="font-size:24px;font-weight:800;margin:6px 0">${txt}</p></div><div class="rowbtn"><button class="btn" id="rg1">Ура!</button></div>`;
  $('#rg1').onclick = () => { closeSheet(); render(); };
}
function handleStart() {
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param; if (!sp) return;
  if (sp.startsWith('p_')) recvCard(dec(sp.slice(2))); else if (sp.startsWith('g_')) recvGift(dec(sp.slice(2)));
}

/* ---------- старт ---------- */
tick(); go('pet');
if (!S.uid) { const u = tgUser(); S.uid = u ? u.id.toString(36) : Math.random().toString(36).slice(2, 8); save(); }
$('#help').onclick = () => openTut(); $('#snd').onclick = toggleSnd; sndBtn();
if (!S.tut) openTut(); else maybeDaily();
setTimeout(handleStart, 900);
setInterval(() => { if (tab === 'pet' && !S.sleeping && !emo && moodKey() === 'happy' && Math.random() < .4) emote(['joy', 'cuddle', 'wink', 'shy', 'wow', 'cool'][Math.random() * 6 | 0]); }, 9000);
try { if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param === 'friend' && !S.welcome) { S.welcome = 1; S.coins += 100; save(); updateHud(); setTimeout(() => toast('Бонус от друга: +100 🪙'), 700); } } catch (e) {}
setInterval(() => { tick(); updateHud(); refreshPet(); }, 3000);
</script>
