<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Напи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#eefaf4;--card:#fff;--ink:#2f3b4a;--hint:#7b8a99;--mint:#7fd8b5;--mint-d:#4fbf96;--lav:#b9a7f0;--peach:#ffc9a8;--pink:#ff8fab;--line:#d9eee4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:520px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative}
.hud{display:flex;justify-content:space-between;padding:12px 14px 4px}
.pill{background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;box-shadow:0 2px 0 var(--line)}
main{flex:1;overflow-y:auto;padding:6px 14px 14px}
nav{display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -2px 12px rgba(79,191,150,.15)}
nav button{flex:1;border:0;background:none;padding:6px 2px;border-radius:14px;font-size:12px;color:var(--hint)}
nav button span{display:block;font-size:22px}
nav button.on{background:#e3f7ee;color:var(--mint-d);font-weight:700}

.stage{position:relative;text-align:center;padding-top:4px}
.bubble{display:inline-block;background:#fff;border-radius:16px;padding:8px 14px;font-size:14px;box-shadow:0 2px 0 var(--line);margin-bottom:4px}
.petbox{position:relative;display:flex;justify-content:center;cursor:pointer;animation:idle 3s ease-in-out infinite}
.petbox.bounce svg{animation:bounce .5s}
@keyframes idle{50%{transform:translateY(-4px)}}
@keyframes bounce{30%{transform:scale(1.12,.9)}60%{transform:scale(.94,1.08)}}
.floaty{position:absolute;top:30%;font-size:26px;animation:fl 1s forwards;pointer-events:none}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.card{background:#fff;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 2px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lvl{background:var(--lav);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.bar{height:12px;background:#e3f2ea;border-radius:8px;overflow:hidden}
.bar.thin{height:8px;margin-top:8px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .4s}
.stat{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.stat em{font-style:normal;color:var(--hint);font-size:12px;text-align:right}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts button{border:0;border-radius:18px;background:#fff;padding:12px 2px;font-size:26px;box-shadow:0 3px 0 var(--line)}
.acts button span{display:block;font-size:11px;color:var(--ink);margin-top:2px;font-weight:600}
.item .em{font-size:34px;width:48px;text-align:center}
.item .grow{flex:1}
.item small{display:block;color:var(--hint);font-size:12px;margin-top:2px}
.btn{border:0;border-radius:16px;padding:12px 18px;font-size:16px;font-weight:700;background:var(--mint-d);color:#fff;cursor:pointer}
.btn.small{padding:8px 14px;font-size:14px}
.btn.ghost{background:#e3f7ee;color:var(--mint-d)}
.btn:disabled{opacity:.45}
.seg{display:flex;gap:8px;margin:6px 0}
.seg button{flex:1;border:0;border-radius:14px;padding:10px;background:#fff;font-weight:700;color:var(--hint)}
.seg button.on{background:var(--mint);color:#fff}
.hint{color:var(--hint);font-size:13px;text-align:center;margin:6px 0}
h3{margin:4px 0 10px}
#sheet{position:fixed;inset:0;background:rgba(30,40,50,.35);display:none;align-items:flex-end;z-index:30}
#sheet.on{display:flex}
#sbody{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:16px 14px 24px;max-height:70vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#2f3b4a;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

#game{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20}
#game.on{display:flex}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:800;font-size:18px}
.ghead button{border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;box-shadow:0 2px 0 var(--line)}
#gbody{flex:1;display:flex;justify-content:center;overflow:hidden}
.gin{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 10px;touch-action:none}
.ghud{font-size:18px;text-align:center}
.bigpet{cursor:pointer}
.bigpet.pop svg{animation:bounce .25s}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,360px);aspect-ratio:1;background:#cfe9dc;padding:8px;border-radius:16px}
.c{display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:800;font-size:clamp(18px,6vw,28px)}
#pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,360px)}
.pc{aspect-ratio:1;border:0;border-radius:14px;background:var(--lav);font-size:30px;position:relative}
.pc span{opacity:0;transition:opacity .2s}
.pc::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:800}
.pc.open,.pc.done{background:#fff;box-shadow:inset 0 0 0 3px var(--mint)}
.pc.open span,.pc.done span{opacity:1}
.pc.open::after,.pc.done::after{display:none}
canvas{width:min(94vw,360px);border-radius:16px;background:#fff;touch-action:none}
#pads{display:flex;gap:8px;width:min(94vw,360px)}
.pad{flex:1;border:0;border-radius:14px;padding:16px 0;font-size:24px;background:#fff;box-shadow:0 3px 0 var(--line)}
.pad:active{transform:translateY(2px)}
.result{justify-content:center;text-align:center}
.result .big{font-size:64px}
.result h2{margin:0}
.result .score{font-size:30px;font-weight:800;margin:0}
.result p{margin:2px 0}
.rowbtn{display:flex;gap:10px;margin-top:10px}
.rec{display:flex;justify-content:space-between;align-items:center}
.rowbtn .btn{flex:1}
.hole{aspect-ratio:1;border:0;border-radius:16px;background:#cfe9dc;font-size:38px;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.sp{padding:34px 0;font-size:48px;border-radius:18px;transition:transform .15s,filter .15s}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"><div id="sbody"></div></div>
<div id="game"><div class="ghead"><span id="gtitle"></span><button id="gclose">✕</button></div><div id="gbody"></div></div>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#eefaf4'); tg.setBackgroundColor('#eefaf4'); } catch (e) {} }
const haptic = k => { try { if (!tg) return; k === 'light' ? tg.HapticFeedback.impactOccurred('light') : tg.HapticFeedback.notificationOccurred(k); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));

/* ---------- данные ---------- */
const FOODS = [
  { id: 'melon', e: '🍉', n: 'Арбуз', f: 32, m: 6, p: 40 },
  { id: 'cookie', e: '🍪', n: 'Печенье', f: 22, m: 14, p: 70 },
  { id: 'banana', e: '🍌', n: 'Банан', f: 26, m: 5, p: 55 },
  { id: 'curry', e: '🍛', n: 'Карри', f: 38, m: 3, p: 100 },
  { id: 'pizza', e: '🍕', n: 'Пицца', f: 30, m: 10, p: 130 }
];
const TOYS = [
  { id: 'balloon', e: '🎈', n: 'Шарик', f: 0, m: 20, p: 60 },
  { id: 'kite', e: '🪁', n: 'Воздушный змей', f: 0, m: 30, p: 90 },
  { id: 'paint', e: '🎨', n: 'Краски', f: 0, m: 40, p: 140 }
];
const ALL = [...FOODS, ...TOYS];
const effText = i => [i.f ? 'Сытость +' + i.f : '', i.m ? 'Настроение +' + i.m : ''].filter(Boolean).join(' · ');

const KEY = 'napi_v1';
const DEF = { coins: 150, hearts: 0, food: 70, mood: 70, energy: 80, xp: 0, lvl: 1, sleeping: false, pats: 0, t: Date.now(), bag: { melon: 1 }, best: {} };
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = Object.assign({}, DEF, load());
if (!S.bag) S.bag = {}; if (!S.best) S.best = {};
const need = l => 40 + l * 30;

function addXP(n) {
  S.xp += n;
  while (S.xp >= need(S.lvl)) { S.xp -= need(S.lvl); S.lvl++; S.coins += 50; toast('Уровень ' + S.lvl + '! +50 🪙'); haptic('success'); }
}
function tick() {
  const now = Date.now(); const dt = Math.min((now - S.t) / 1000, 8 * 3600); S.t = now;
  if (S.sleeping) {
    S.energy = clamp(S.energy + dt * 0.15); S.food = clamp(S.food - dt * 0.002);
    if (S.energy >= 100) S.sleeping = false;
  } else {
    S.food = clamp(S.food - dt * 0.004);
    S.mood = clamp(S.mood - dt * 0.003 - (S.food < 20 ? dt * 0.006 : 0));
    S.energy = clamp(S.energy - dt * 0.002);
  }
  save();
}
const moodKey = () => S.sleeping ? 'sleep' : S.food < 25 ? 'hungry' : S.mood < 35 ? 'sad' : 'happy';
const SPEECH = { sleep: 'Z-z-z… 💤', hungry: 'Напи проголодался 🍽️', sad: 'Напи скучает… поиграй со мной', happy: 'Напи в восторге! 🥰' };

/* ---------- питомец (SVG) ---------- */
function petSVG(mood, size = 180) {
  const ink = '#2f3b4a';
  const fur = '#fffaf5', line = '#d9a0b4', pink = '#ffb3c6';
  const eyes = mood === 'sleep'
    ? `<path d="M60 100q10 7 20 0M100 100q10 7 20 0" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : `<circle cx="70" cy="100" r="7" fill="${ink}"/><circle cx="110" cy="100" r="7" fill="${ink}"/><circle cx="72.5" cy="97.5" r="2.5" fill="#fff"/><circle cx="112.5" cy="97.5" r="2.5" fill="#fff"/>`;
  const mouth = { happy: `<path d="M80 119q5 8 10 0q5 8 10 0" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    sad: `<path d="M80 125q5-7 10 0q5-7 10 0" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    hungry: `<ellipse cx="90" cy="123" rx="6" ry="7" fill="${ink}"/>`,
    sleep: `<path d="M85 121q5 3 10 0" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/><text x="134" y="56" font-size="20" fill="#7b8a99" font-weight="700">z</text><text x="148" y="40" font-size="15" fill="#7b8a99" font-weight="700">z</text>` }[mood];
  return `<svg viewBox="0 0 180 170" width="${size}" height="${size * 170 / 180}">
    <ellipse cx="90" cy="162" rx="54" ry="7" fill="rgba(0,0,0,.08)"/>
    <g transform="rotate(-8 62 70)"><ellipse cx="62" cy="40" rx="15" ry="38" fill="${fur}" stroke="${line}" stroke-width="4"/><ellipse cx="62" cy="44" rx="7" ry="26" fill="${pink}"/></g>
    <g transform="rotate(16 120 70)"><ellipse cx="120" cy="40" rx="15" ry="38" fill="${fur}" stroke="${line}" stroke-width="4"/><ellipse cx="120" cy="44" rx="7" ry="26" fill="${pink}"/></g>
    <path d="M90 64C142 64 160 100 156 130c-3 24-30 32-66 32S27 154 24 130C20 100 38 64 90 64Z" fill="${fur}" stroke="${line}" stroke-width="4"/>
    <ellipse cx="62" cy="160" rx="17" ry="8" fill="${fur}" stroke="${line}" stroke-width="3"/><ellipse cx="118" cy="160" rx="17" ry="8" fill="${fur}" stroke="${line}" stroke-width="3"/>
    <ellipse cx="50" cy="118" rx="10" ry="6.5" fill="${pink}"/><ellipse cx="130" cy="118" rx="10" ry="6.5" fill="${pink}"/>
    <path d="M40 110h-14M42 119l-13 5M140 110h14M138 119l13 5" stroke="${line}" stroke-width="2.5" stroke-linecap="round"/>
    ${eyes}<path d="M85 109h10l-5 6z" fill="#ff8fab" stroke="#ff8fab" stroke-width="2" stroke-linejoin="round"/>${mouth}</svg>`;
}

/* ---------- интерфейс ---------- */
let tab = 'pet', shopTab = 'food', lastKey = '', resetArm = false;
const TABS = [['pet', '🌱', 'Напи'], ['shop', '🛒', 'Магазин'], ['games', '🎮', 'Игры'], ['top', '🏆', 'Рекорды']];
$('#app').innerHTML = `<div class="hud"><div class="pill">🪙 <b id="hc"></b></div><div class="pill">❤️ <b id="hh"></b></div><button class="pill" id="help" style="border:0;font-size:16px">❓</button></div><main id="main"></main><nav>${TABS.map(t => `<button data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { haptic('light'); go(b.dataset.t); });
function updateHud() { $('#hc').textContent = S.coins; $('#hh').textContent = S.hearts; }
function go(t) { tab = t; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); render(); }
function render() { updateHud(); ({ pet: renderPet, shop: renderShop, games: renderGames, top: renderTop })[tab](); }

let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1900); }
function bounce() { const b = $('#petbox'); if (!b) return; b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce'); }
function floaty(txt) { const b = $('#petbox'); if (!b) return; const f = document.createElement('div'); f.className = 'floaty'; f.textContent = txt; f.style.left = (30 + Math.random() * 40) + '%'; b.appendChild(f); setTimeout(() => f.remove(), 1000); }

function renderPet() {
  $('#main').innerHTML = `
  <div class="stage"><div class="bubble" id="bub"></div><div id="petbox" class="petbox"></div></div>
  <div class="card"><div class="row"><b>Напи</b><span class="lvl" id="lvl"></span></div>
    <div class="bar thin"><i id="bxp" style="background:var(--lav)"></i></div>
    <div class="stat">🍽️ Сытость<div class="bar"><i id="bf" style="background:var(--pink)"></i></div><em id="vf"></em></div>
    <div class="stat">😊 Настроение<div class="bar"><i id="bm" style="background:var(--peach)"></i></div><em id="vm"></em></div>
    <div class="stat">⚡ Энергия<div class="bar"><i id="be" style="background:var(--mint)"></i></div><em id="ve"></em></div>
  </div>
  <div class="acts">
    <button data-a="feed">🍽️<span>Покормить</span></button>
    <button data-a="toy">🎈<span>Игрушка</span></button>
    <button data-a="pat">🤚<span>Погладить</span></button>
    <button data-a="sleep">🌙<span id="slp">Спать</span></button>
  </div>
  <p class="hint">Тапни по Напи, чтобы погладить. Монеты и сердечки — в играх.</p>`;
  $('#petbox').onclick = pat;
  document.querySelectorAll('.acts button').forEach(b => b.onclick = () => { haptic('light'); ({ feed: () => openBag('food'), toy: () => openBag('toy'), pat, sleep: toggleSleep })[b.dataset.a](); });
  lastKey = ''; refreshPet();
}
function refreshPet() {
  if (tab !== 'pet' || !$('#petbox')) return;
  const k = moodKey();
  if (k !== lastKey) { lastKey = k; $('#petbox').innerHTML = petSVG(k); $('#bub').textContent = SPEECH[k]; }
  [['bf', 'vf', S.food], ['bm', 'vm', S.mood], ['be', 've', S.energy]].forEach(([b, v, x]) => { $('#' + b).style.width = x + '%'; $('#' + v).textContent = Math.round(x) + '/100'; });
  $('#bxp').style.width = (S.xp / need(S.lvl) * 100) + '%';
  $('#lvl').textContent = 'Lvl ' + S.lvl;
  $('#slp').textContent = S.sleeping ? 'Разбудить' : 'Спать';
}
function pat() {
  if (S.sleeping) { toast('Тсс… Напи спит'); return; }
  S.mood = clamp(S.mood + 4); S.pats++; addXP(1);
  if (S.pats % 15 === 0) { S.hearts++; toast('+1 ❤️ за ласку'); }
  floaty('💗'); bounce(); haptic('light'); save(); updateHud(); refreshPet();
}
function toggleSleep() { S.sleeping = !S.sleeping; save(); refreshPet(); toast(S.sleeping ? 'Спокойной ночи 🌙' : 'Доброе утро ☀️'); }

function openBag(kind) {
  const list = kind === 'food' ? FOODS : TOYS, have = list.filter(i => (S.bag[i.id] || 0) > 0);
  $('#sheet').classList.add('on');
  $('#sbody').innerHTML = `<h3>${kind === 'food' ? '🧊 Холодильник' : '🎈 Игрушки'}</h3>` + (have.length
    ? have.map(i => `<div class="card row item"><span class="em">${i.e}</span><div class="grow"><b>${i.n}</b><small>${effText(i)}</small></div><button class="btn small" data-use="${i.id}">Дать ×${S.bag[i.id]}</button></div>`).join('')
    : `<p class="hint">Пусто. Загляни в магазин!</p><div style="text-align:center"><button class="btn" id="toshop">В магазин</button></div>`);
  const ts = $('#toshop'); if (ts) ts.onclick = () => { closeSheet(); shopTab = kind; go('shop'); };
  document.querySelectorAll('[data-use]').forEach(b => b.onclick = () => useItem(b.dataset.use));
}
function closeSheet() { $('#sheet').classList.remove('on'); }
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
function useItem(id) {
  if (S.sleeping) { closeSheet(); toast('Напи спит 🌙'); return; }
  const i = ALL.find(x => x.id === id); if (!i || !(S.bag[id] > 0)) return;
  S.bag[id]--; S.food = clamp(S.food + i.f); S.mood = clamp(S.mood + i.m); addXP(3); save(); closeSheet(); haptic('success');
  render();
  if (tab === 'pet') { bounce(); floaty(i.e); $('#bub').textContent = 'Спасибо! 😋'; lastKey = ''; setTimeout(refreshPet, 2000); }
}

function renderShop() {
  const list = shopTab === 'food' ? FOODS : TOYS;
  $('#main').innerHTML = `<div class="seg"><button data-s="food" class="${shopTab === 'food' ? 'on' : ''}">🍽️ Еда</button><button data-s="toy" class="${shopTab === 'toy' ? 'on' : ''}">🎈 Игрушки</button></div>
  <p class="hint">Купленное попадает в холодильник и к игрушкам. Монеты зарабатывай в играх!</p>` +
    list.map(i => `<div class="card row item"><span class="em">${i.e}</span><div class="grow"><b>${i.n}</b> <small style="display:inline">· есть ${S.bag[i.id] || 0}</small><small>${effText(i)}</small></div><button class="btn small" data-buy="${i.id}">${i.p} 🪙</button></div>`).join('');
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { shopTab = b.dataset.s; renderShop(); });
  document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const i = ALL.find(x => x.id === b.dataset.buy);
    if (S.coins < i.p) { haptic('error'); toast('Не хватает монет 🪙'); return; }
    S.coins -= i.p; S.bag[i.id] = (S.bag[i.id] || 0) + 1; save(); haptic('success'); toast('Куплено: ' + i.e + ' ' + i.n); render();
  });
}

function renderGames() {
  $('#main').innerHTML = `<h3>🎮 Игры</h3><p class="hint" style="text-align:left">Каждая игра тратит немного энергии, но поднимает настроение.</p>` +
    GAMES.map(g => `<div class="card row item"><span class="em">${g.e}</span><div class="grow"><b>${g.n}</b><small>${g.d}</small></div><button class="btn small" data-g="${g.id}">Играть</button></div>`).join('');
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { haptic('light'); openGame(b.dataset.g); });
}
function renderTop() {
  $('#main').innerHTML = `<h3>🏆 Рекорды</h3><div class="card"><div class="rec"><b>Уровень Напи</b><span class="lvl">${S.lvl}</span></div></div>` +
    GAMES.map(g => `<div class="card rec"><span>${g.e} ${g.n}</span><b>${S.best[g.id] ? S.best[g.id] + ' ' + g.unit : '—'}</b></div>`).join('') +
    `<div class="card row"><div><b>👥 Друзья</b><small style="display:block;color:var(--hint);font-size:12px;margin-top:2px">Позови друга: тебе +50 🪙 и +1 ❤️ (один раз), другу +100 🪙</small></div><button class="btn small" id="inv">Позвать</button></div><p style="text-align:center"><button class="btn ghost small" id="how">❓ Как играть</button> <button class="btn ghost small" id="reset">Начать заново</button></p>`;
  $('#inv').onclick = invite; $('#how').onclick = () => openTut();
  $('#reset').onclick = () => {
